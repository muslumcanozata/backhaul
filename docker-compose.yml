services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: backhaul
      POSTGRES_PASSWORD: backhaul
      POSTGRES_DB: backhaul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
    environment:
      DEPLOYMENT_MODE: shared
      DATABASE_URL: sqlite:////data/backhaul.db
      JWT_SECRET: dev-only-change-me-please
      SECRETS_KEY: dev-only-secrets-key
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@backhaul.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-backhaul-admin}
      TELEMATICS_POLL_SECONDS: ${TELEMATICS_POLL_SECONDS:-30}
    volumes:
      - api-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  proxy:
    image: jc21/nginx-proxy-manager:2
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt

volumes:
  api-data:
  postgres-data:
  npm-data:
  npm-letsencrypt:
