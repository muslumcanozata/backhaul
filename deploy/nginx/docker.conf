# Konteyner içi nginx. API servis adı: api
# Statik arayüz aynı origin üzerinden servis edilir; VITE_API_URL boş kalır.

upstream backhaul_api {
    server api:8000;
    keepalive 8;
}

server {
    listen 80;
    server_name backhaul.odco.tech;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    location /live {
        proxy_pass http://backhaul_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/(auth|tenants|vehicles|drivers|settings|loads|alerts|tacho|reports|users|sms|returns|integrations|health)(/|$) {
        proxy_pass http://backhaul_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
