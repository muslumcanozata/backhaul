# Statik IP veya herhangi bir arayüz. IP yazılmaz; 80 tüm adreslerde dinler.
# Kurulum:
#   cd apps/web && npm ci && npm run build
#   sudo mkdir -p /var/www/backhaul && sudo cp -a dist/. /var/www/backhaul/
#   API yalnız yerelde: uvicorn app.main:app --host 127.0.0.1 --port 8000
#   sudo cp deploy/nginx/backhaul.conf /etc/nginx/sites-available/backhaul
#   sudo ln -sf /etc/nginx/sites-available/backhaul /etc/nginx/sites-enabled/backhaul
#   sudo nginx -t && sudo systemctl reload nginx
# Tarayıcı: http://<statik-ip>/

upstream backhaul_api {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/backhaul;
    index index.html;
    client_max_body_size 20m;

    location /live {
        proxy_pass http://backhaul_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/(auth|tenants|vehicles|drivers|settings|loads|alerts|tacho|reports|users|sms|returns|integrations|health)(/|$) {
        proxy_pass http://backhaul_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
